services:
  # --- LLM + embedding server ---
  ollama:
    image: ollama/ollama:latest
    container_name: graphrag-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [graphrag]

  # One-shot job: pulls the LLM + embedding models into the shared
  # ollama_data volume, then exits. Runs once per `docker compose up`;
  # on later runs it's near-instant since the models are already cached
  # in the volume and `ollama pull` no-ops if nothing changed.
  model-init:
    image: ollama/ollama:latest
    container_name: graphrag-model-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
      LLM_MODEL: ${LLM_MODEL:-mistral}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Pulling LLM model: $$LLM_MODEL (this can take a while on first run)..."
        ollama pull "$$LLM_MODEL"
        echo "Pulling embedding model: $$EMBEDDING_MODEL..."
        ollama pull "$$EMBEDDING_MODEL"
        echo "Model pull complete."
    networks: [graphrag]

  # --- Vector store (chunk embeddings) ---
  qdrant:
    image: qdrant/qdrant:latest
    container_name: graphrag-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [graphrag]

  # --- Graph store (entities + relationships) ---
  neo4j:
    image: neo4j:5.24-community
    container_name: graphrag-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-graphrag_password}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474" # Neo4j Browser (http://localhost:7474) -- handy for poking at the graph directly
      - "7687:7687" # Bolt protocol, used by the backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-graphrag_password} 'RETURN 1' || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks: [graphrag]

  # --- FastAPI backend: ingestion pipeline + hybrid retrieval + generation ---
  backend:
    build: ./backend
    container_name: graphrag-backend
    depends_on:
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-mistral}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-graphrag_password}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
    volumes:
      - uploads_data:/app/data/uploads
    ports:
      - "8000:8000"
    networks: [graphrag]

  # --- Next.js frontend ---
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: graphrag-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks: [graphrag]

volumes:
  ollama_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  uploads_data:

networks:
  graphrag:
    driver: bridge
